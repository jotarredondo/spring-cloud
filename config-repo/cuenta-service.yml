server:
  port: 8081

spring:
  application:
    name: cuenta-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

mensaje:
  prueba: "Hola desde Config Server"

resilience4j:
  circuitbreaker:
    instances:
      movimientoService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50